name: ci

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    uses: tty-pt/ci/.github/workflows/all-in-one.yml@main
    with:
      name: liblamina
      publish_to: "deb,apk,rpm,brew,openbsd,winget"
      deps: "libstele,libcorm,libglfw3-dev,libpng-dev,libglew-dev"
      deps_apk: "libstele,libcorm,glfw-dev,libpng-dev,glew-dev"
      deps_rpm: "libstele,libcorm,glfw-devel,libpng-devel,glew-devel"
      deps_brew: "libstele,libcorm,glfw,libpng"
      deps_openbsd: "libstele,libcorm,glfw,png,glew,xxhash"
      deps_winget: "mingw-w64-x86_64-glfw,mingw-w64-x86_64-libpng,mingw-w64-x86_64-glew,mingw-w64-x86_64-xxhash"
      deps_winget_tty: "libstele,libcorm"
    secrets: inherit
